const CT = CT_PARTS.join("");

function b64d(s){
  const bin = atob(s), len = bin.length, u8 = new Uint8Array(len);
  for(let i=0;i<len;i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
let busy = false;
async function unlock(){
  if(busy) return;
  const pw = document.getElementById("pw").value;
  const errEl = document.getElementById("err"), btn = document.getElementById("btn");
  if(!pw) { errEl.textContent = "请输入口令"; return; }
  busy = true; btn.disabled = true; btn.textContent = "解密中…"; errEl.textContent = "";
  try{
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64d(SALT), iterations:ITER, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(NONCE)}, key, b64d(CT));
    const html = new TextDecoder().decode(buf);
    sessionStorage.setItem("cal_key", pw);
    document.open(); document.write(html); document.close();
  }catch(e){
    errEl.textContent = "口令不正确，请重试";
    btn.disabled = false; btn.textContent = "进入"; busy = false;
  }
}
/* 同一标签页内刷新无需重复输入 */
(function(){
  const cached = sessionStorage.getItem("cal_key");
  if(cached){ document.getElementById("pw").value = cached; unlock(); }
})();
</script>
