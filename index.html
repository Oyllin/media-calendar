<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自媒体发布规划&数据 · Q4 内容排期看板</title>
<style>
  :root{
    --bg:#F6F7F9;
    --card:#FFFFFF;
    --ink:#1F2430;
    --ink-2:#5A6473;
    --ink-3:#8C96A5;
    --line:#E7EAEF;
    --brand:#373C43;
    --shadow:0 1px 2px rgba(31,36,48,.05), 0 8px 24px rgba(31,36,48,.06);
    --shadow-sm:0 1px 2px rgba(31,36,48,.06);
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;padding:0 0 64px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1400px;margin:0 auto;padding:0 24px}

  /* ---------- header ---------- */
  .topbar{background:var(--brand);color:#fff;padding:32px 0 28px;margin-bottom:22px}
  .topbar .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .t-title{font-size:28px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:12px}
  .t-title .dot{width:10px;height:10px;border-radius:50%;background:#FF3B5C;box-shadow:0 0 0 4px rgba(255,59,92,.22)}
  .t-sub{color:rgba(255,255,255,.66);font-size:13px;margin-top:6px}
  .btn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;padding:8px 16px;
    border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{background:rgba(255,255,255,.18)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-sm)}
  .stat .k{font-size:12px;color:var(--ink-3);letter-spacing:.3px}
  .stat .v{font-size:28px;font-weight:700;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:2px}
  .stat .d{font-size:12px;color:var(--ink-2);margin-top:2px}

  /* ---------- charts ---------- */
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-sm)}
  .panel h3{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h3::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}
  .panel h3 .hint{font-size:11px;font-weight:600;color:var(--ink-3);margin-left:auto;font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:10px;height:112px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
  .bar{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#5B7CFA,#3B5BDB);min-height:4px;transition:.25s}
  .bar.g{background:linear-gradient(180deg,#FF7A8A,#FF3B5C)}
  .bar-lb{font-size:11px;color:var(--ink-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bar-vl{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar-col.click{cursor:pointer;border-radius:10px;padding:2px;transition:.15s}
  .bar-col.click:hover{background:#F2F4F8}
  .bar-col.click.on{background:#EEF1F7;box-shadow:inset 0 0 0 1px #D8DFEA}
  .bar-col.click.on .bar-lb{color:var(--ink);font-weight:700}
  .hbars{display:flex;flex-direction:column;gap:7px;height:auto;justify-content:flex-start}
  .hbar-row{display:grid;grid-template-columns:92px 1fr 24px;align-items:center;gap:9px;font-size:12px}
  .hbar-row .nm{color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .hbar-row .bar-h{height:11px;border-radius:4px;min-width:4px;transition:.25s}
  .hbar-row .nv{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .hbar-row.zero .nm{color:var(--ink-3)}
  .hbar-row.zero .bar-h{background:#EBEEF3 !important}

  /* ---------- toolbar ---------- */
  .toolbar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;
    box-shadow:var(--shadow-sm);margin-bottom:18px}
  .frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .frow + .frow{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .flabel{font-size:12px;color:var(--ink-3);width:44px;flex:none;font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;user-select:none}
  .chip:hover{border-color:#C9D0DB;background:#FBFCFD}
  .chip .sw{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
  .chip .ct{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .chip.on{color:#fff;border-color:transparent;font-weight:600}
  .chip.on .ct{color:rgba(255,255,255,.82)}
  .chip.on .sw{background:#fff !important}
  .chip.ghost{background:transparent;border-style:dashed}
  .chip.ghost.on{background:var(--brand);border-style:solid}
  .mtab{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:7px 16px;border-radius:10px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s;font-weight:600}
  .mtab:hover{border-color:#C9D0DB;background:#FBFCFD}
  .mtab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .mtab .n{background:#F0F2F6;color:var(--ink-2);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}
  .mtab.on .n{background:rgba(255,255,255,.22);color:#fff}
  .q4sum{margin-left:auto;font-size:12px;color:var(--ink-3)}
  .q4sum b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}

  .tabs{display:inline-flex;background:#EDEFF3;border-radius:12px;padding:4px;gap:2px}
  .tab{border:0;background:transparent;padding:7px 18px;border-radius:9px;font-size:13px;cursor:pointer;
    color:var(--ink-2);font-family:inherit;font-weight:600;transition:.15s}
  .tab.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}

  /* ---------- calendar ---------- */
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-bottom:9px}
  .cal-head div{text-align:center;font-size:12px;font-weight:700;color:var(--ink-2);padding:5px 0}
  .week{margin-bottom:14px}
  .week-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
  .week-tag .n{width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px}
  .week-tag .r{font-weight:600;color:var(--ink-3)}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:118px;padding:9px;
    display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);transition:.15s}
  .day:hover{border-color:#CBD3DF;box-shadow:var(--shadow)}
  .day.dim{background:#FAFBFC}
  .day.today{border-color:#FF3B5C;box-shadow:0 0 0 3px rgba(255,59,92,.10)}
  .dnum{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .dnum b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .dnum .tbadge{font-size:10px;font-weight:700;color:#fff;background:#FF3B5C;border-radius:999px;padding:1px 7px}
  .dnum .wdoff{font-size:10px;color:var(--ink-3)}

  .item{border-radius:10px;padding:7px 9px;cursor:pointer;border:1px solid transparent;transition:.15s;position:relative}
  .item:hover{transform:translateY(-1px);filter:brightness(.985)}
  .item.draft{border-style:dashed !important;border-width:1.5px !important;background:#fff !important}
  .item .t{font-size:12.5px;font-weight:600;line-height:1.4;word-break:break-word;padding-right:30px}
  .item .meta{font-size:10.5px;opacity:.72;margin-top:2px}
  .item .plats{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .ptag{font-size:10px;font-weight:700;line-height:1;border-radius:5px;padding:3px 5px;color:#fff;letter-spacing:.5px}
  .draft-dot{position:absolute;top:6px;right:7px;font-size:9px;font-weight:700;color:#9A7B2E;
    background:#FFF4D6;border:1px solid #EEDCAA;border-radius:4px;padding:1px 4px;line-height:1.35}
  .span-badge{display:inline-block;font-size:10px;font-weight:600;color:#8A6A1F;background:#FFF6DF;
    border:1px solid #F0E0AE;border-radius:5px;padding:1px 5px;margin-left:4px}
  .cont{opacity:.62;font-style:italic}
  .empty-day{flex:1;display:grid;place-items:center;color:#D6DBE3;font-size:11px}

  /* ---------- platform view ---------- */
  .plats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .pcol{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
  .pcol-h{padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pcol-h .nm{font-size:14px;font-weight:700}
  .pcol-h .ab{font-size:11px;opacity:.8;margin-top:1px}
  .pcol-h .ct{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.95}
  .pcol-b{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
  .pitem{border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;transition:.15s;background:#fff;position:relative}
  .pitem:hover{border-color:#CBD3DF;box-shadow:var(--shadow);transform:translateY(-1px)}
  .pitem.draft{border-style:dashed;border-width:1.5px}
  .pitem .d{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .pitem .d .wk{background:#F0F2F6;border-radius:5px;padding:1px 6px;font-weight:600;color:var(--ink-2)}
  .pitem .d b{color:var(--ink);font-size:12px}
  .pitem .tt{font-size:13px;font-weight:600;line-height:1.45;padding-right:34px}
  .pitem .cs{font-size:11px;color:var(--ink-2);margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
  .cs span{background:#F4F6F9;border-radius:5px;padding:2px 7px}
  .pitem .pl{margin-top:7px;display:flex;gap:4px}
  .pempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#B9C1CD;
    gap:6px;padding:26px 10px;text-align:center}
  .pempty .ic{font-size:26px;opacity:.5}
  .pempty .tx{font-size:12px}

  /* ---------- list view ---------- */
  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{background:#F4F6F9;text-align:left;padding:12px 16px;font-size:12px;color:var(--ink-2);font-weight:700;
    white-space:nowrap;border-bottom:1px solid var(--line)}
  tbody td{padding:12px 16px;border-bottom:1px solid #F0F2F6;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FAFBFD}
  tbody tr{cursor:pointer}
  .gpill{display:inline-block;border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:700}
  .st{font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px;white-space:nowrap}
  .st.ok{background:#E9F5EE;color:#2E7D51}
  .st.df{background:#FFF4D6;color:#9A7B2E}

  /* ---------- misc ---------- */
  .nobar{font-size:12px;color:var(--ink-3);margin-bottom:12px}
  .empty-tip{background:#fff;border:1.5px dashed #D8DEE8;border-radius:14px;padding:22px;text-align:center;margin-bottom:16px}
  .empty-tip .t{font-size:15px;font-weight:700;color:var(--ink)}
  .empty-tip .s{font-size:12.5px;color:var(--ink-2);margin-top:5px}
  .empty-tip .hint{font-size:12px;color:var(--ink-3);margin-top:12px;background:#F7F9FC;border-radius:9px;
    padding:10px 14px;display:inline-block;text-align:left;line-height:1.85}
  .empty-tip .hint b{color:var(--ink-2)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
  .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .hidden{display:none !important}

  /* ---------- 账号数据 ---------- */
  .subnav{display:flex;gap:8px;justify-content:center;padding:4px 0 18px}
  .seg{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:9px 24px;border-radius:999px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .seg:hover{border-color:#C9D0DB;background:#FBFCFD}
  .seg.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:18px}
  .acard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
  .acard.skeleton{opacity:.92}
  .acard-h{padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .acard-h .an{font-size:15px;font-weight:700}
  .acard-h .ah{font-size:11px;opacity:.85;margin-top:2px}
  .acard-h .abadge{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 9px}
  .ametrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .ametric{background:#fff;padding:12px 8px;text-align:center}
  .ametric .mv{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2;word-break:break-all}
  .ametric .ml{font-size:11px;color:var(--ink-3);margin-top:3px}
  .aspark{padding:12px 16px;background:#fff}
  .aspark.empty{color:var(--ink-3);font-size:12px;text-align:center;padding:18px}
  .dtip{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-top:14px;font-size:12.5px;color:var(--ink-2);line-height:1.9}
  .dtip b{color:var(--ink)}
  @media (max-width:560px){ .ametrics{grid-template-columns:repeat(2,1fr)} }

  /* ---------- 全平台原始数据 ---------- */
  .raw-head{text-align:center;padding:4px 0 16px}
  .raw-title{font-size:21px;font-weight:700;letter-spacing:.4px}
  .raw-meta{font-size:12.5px;color:var(--ink-2);margin-top:5px}
  .raw-meta b{color:var(--ink);font-weight:600}
  .raw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px;margin-top:6px}
  .raw-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
  .raw-card-h{padding:11px 16px;color:#fff;display:flex;align-items:center;gap:10px}
  .raw-card-h .pbadge{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 11px}
  .raw-card-h .pname{font-size:14px;font-weight:600}
  .raw-card-b{padding:14px 16px}
  .raw-tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
  .raw-tbl th{background:#F2F5F9;color:var(--ink-2);font-weight:600;text-align:left;padding:8px 10px;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .raw-tbl td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
  .raw-tbl td.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
  .raw-tbl td.rk{text-align:center;font-weight:700;width:36px;color:var(--ink-2)}
  .raw-tbl td.mom{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
  .raw-tbl td.mom.up{color:#D7303A}
  .raw-tbl td.mom.down{color:#1E9E5A}
  .raw-tbl td.mom.na{color:var(--ink-3)}
  .raw-tbl td.ph{color:var(--ink-3);text-align:center}
  .raw-tbl td.tt{font-weight:600;color:var(--ink)}
  .raw-top-title{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 4px}
  .raw-note{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.6}
  .raw-foot{margin-top:20px;text-align:center;font-size:12px;color:var(--ink-3);line-height:1.9;border-top:1px solid var(--line);padding-top:16px}
  .raw-foot .rf-brand{font-weight:700;color:var(--ink-2);margin-bottom:4px}
  .raw-foot .rf-line b{color:var(--ink-2);font-weight:600}
  @media (max-width:520px){ .raw-grid{grid-template-columns:1fr} }

  /* ---------- modal ---------- */
  .mask{position:fixed;inset:0;background:rgba(31,36,48,.42);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:90;padding:20px}
  .modal{background:#fff;border-radius:18px;width:min(460px,100%);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.22)}
  .m-h{padding:20px 22px;color:#fff}
  .m-h .tt{font-size:18px;font-weight:700;line-height:1.4}
  .m-h .sb{font-size:12px;opacity:.85;margin-top:4px}
  .m-b{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .kv{display:flex;gap:12px}
  .kv .k{width:66px;flex:none;font-size:12px;color:var(--ink-3);padding-top:1px}
  .kv .v{font-size:13.5px;color:var(--ink);font-weight:600}
  .pf{display:flex;gap:6px;flex-wrap:wrap}
  .pf .b{border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:#fff}
  .m-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;background:#FAFBFC}
  .m-f .btn{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
  .m-f .btn:hover{background:#F2F4F7;color:var(--ink)}

  .foot{margin-top:22px;font-size:12px;color:var(--ink-3);text-align:center;line-height:1.9}
  .foot .note{display:inline-block;background:#fff;border:1px dashed #DDE2EA;border-radius:8px;padding:6px 14px;margin-bottom:8px}

  @media (max-width:1180px){
    .plats-grid{grid-template-columns:repeat(3,1fr)}
    .charts{grid-template-columns:1fr 1fr}
  }
  @media (max-width:820px){
    .wrap{padding:0 14px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .charts{grid-template-columns:1fr}
    .plats-grid{grid-template-columns:repeat(2,1fr)}
    .cal-head{display:none}
    .days{grid-template-columns:1fr;gap:8px}
    .day{min-height:0;flex-direction:row;align-items:flex-start;gap:12px}
    .dnum{flex-direction:column;align-items:flex-start;width:56px;flex:none}
    .day .items{display:flex;flex-direction:column;gap:6px;flex:1}
    .empty-day{display:none}
  }
  @media print{
    body{background:#fff;padding:0}
    .toolbar,.btn,.tabs,.subnav{display:none !important}
    .topbar{background:#373C43 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div>
      <div class="t-title"><span class="dot"></span>自媒体发布规划&数据</div>
      <div class="t-sub">内容排期 · 账号数据 · 全平台原始数据 运营看板 · 2026.08.31 — 2027.01.03 · 4 个月 / 18 周</div>
    </div>
    <button class="btn" onclick="window.print()">打印 / 导出 PDF</button>
  </div>
</div>

<div class="wrap">

  <div class="subnav" id="subnav">

  const usedP = PLATFORMS.filter(p=>state.plats.has(p.key) && list.some(it=>visPlats(it).includes(p.key)));
  const counts = PLATFORMS.map(p=>({p, n:list.filter(it=>visPlats(it).includes(p.key)).length}));
  const top = counts.slice().sort((a,b)=>b.n-a.n)[0];
  const m = MONTH_MAP[state.month];
  const draftN = list.filter(i=>i.draft).length;

  const cards = [
    {k:'内容选题', v:list.length, u:' 条', d:list.length?`覆盖 ${days} 个发布日`:'本月尚未排期'},
    {k:'平台发布总数', v:posts, u:' 条', d:posts?'一条选题多平台分发':'待补充'},
    {k:'已启用平台', v:usedP.length + ' / ' + PLATFORMS.length, d:usedP.length?usedP.map(p=>p.name).join(' · '):'待补充'},
    {k:'主力平台', v:(top&&top.n)?top.p.name:'—', d:(top&&top.n)?`共 ${top.n} 条选题`:'待补充'}
  ];
  document.getElementById('stats').innerHTML = cards.map(c=>`
    <div class="stat">
      <div class="k">${c.k}</div>
      <div class="v">${esc(c.v)}<small>${esc(c.u||'')}</small></div>
      <div class="d">${esc(c.d)}</div>
    </div>`).join('');

  document.getElementById('wkHint').textContent = `${m.name} · ${m.theme}`;
  document.getElementById('plHint').textContent = draftN ? `含 ${draftN} 条建议排期` : '全部已确认';
}

function renderCal(){
  const list = curItems();
  const grid = MONTH_MAP[state.month].grid;
  const occ = {};
  list.forEach(it=>{
    (occ[it.date] = occ[it.date] || []).push({it, cont:false});
    if(it.span>1){
      const i0 = MASTER.findIndex(d=>d.date===it.date);
      for(let s=1;s<it.span;s++){
        const d = MASTER[i0+s];
        if(d) (occ[d.date] = occ[d.date]||[]).push({it, cont:true});
      }
    }
  });

  let html = `<div class="cal-head">` +
    WEEKDAYS.map((w,i)=>`<div>${w}</div>`).join('') + `</div>`;

  const weeks = Math.round(grid.length/7);
  for(let w=1; w<=weeks; w++){
    const wd = grid.filter(d=>d.wk===w);
    const n = list.filter(it=>it.wk===w).length;
    html += `<div class="week">
      <div class="week-tag"><span class="n">${w}</span>第${WK_CN[w-1]}周
        <span class="r">${esc(wd[0].label)} — ${esc(wd[wd.length-1].label)} · ${n} 条选题</span></div>
      <div class="days">`;
    wd.forEach(d=>{
      const has = (occ[d.date]||[]).length>0;
      const isToday = d.date===TODAY;
      html += `<div class="day ${has?'':'dim'} ${isToday?'today':''}">
        <div class="dnum"><b>${esc(d.label)}</b>
          ${isToday?'<span class="tbadge">今天</span>':'<span class="wdoff">'+WEEKDAYS[d.wd-1]+'</span>'}</div>
        <div class="items">`;
      if(has){
        occ[d.date].forEach(o=>{
          const it=o.it, ps=visPlats(it);
          html += `<div class="item ${it.draft?'draft':''} ${o.cont?'cont':''}" style="${itemStyle(it)}" data-id="${it.id}">
            ${it.draft?'<span class="draft-dot">建议</span>':''}
            <div class="t">${esc(it.title)}${it.span>1?`<span class="span-badge">${o.cont?'接 '+it.endLabel:'跨 '+it.span+' 天'}</span>`:''}</div>
            <div class="meta">${esc(GROUP_MAP[it.group].name)} · ${esc(it.col)}</div>
            <div class="plats">${ps.map(k=>`<span class="ptag" style="background:${PLAT_MAP[k].color}">${PLAT_MAP[k].abbr}</span>`).join('')}</div>
          </div>`;
        });
      }else html += `<div class="empty-day">—</div>`;
      html += `</div></div>`;
    });
    html += `</div></div>`;
  }
  document.getElementById('viewCal').innerHTML = html;
  bindItems();
}

/* ==================== 账号数据 ==================== */
function fmtNum(n){
  if(n==null || isNaN(n)) return '—';
  const a = Math.abs(n);
  if(a >= 1e8) return (n/1e8).toFixed(2)+'亿';
  if(a >= 1e4) return (n/1e4).toFixed(1)+'万';
  return n.toLocaleString('en-US');
}
function sparkline(trend, color){
  if(!trend || trend.length<2) return `<div class="aspark empty">趋势需 ≥2 期数据后显示曲线</div>`;
  const w=240,h=52,pad=6;
  const vals = trend.map(t=>t.fans);
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const pts = trend.map((t,i)=>{
    const x = pad + (trend.length===1?0:i*(w-2*pad)/(trend.length-1));
    const y = h-pad - (t.fans-mn)/rng*(h-2*pad);
    return [x,y];
  });
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="aspark" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
function acard(a){
  const p = PLAT_MAP[a.key] || {name:a.key,color:'#888',abbr:''};
  const m = a.m || {};
  const cells = METRICS.map(mt=>`<div class="ametric"><div class="mv">${m[mt.k]==null?'—':fmtNum(m[mt.k])}</div><div class="ml">${mt.t}</div></div>`).join('');
  return `<div class="acard">
    <div class="acard-h" style="background:${p.color}">
      <div><div class="an">${esc(a.name||p.name)}</div>${a.handle?`<div class="ah">${esc(a.handle)}</div>`:''}</div>
      <div class="abadge">${p.abbr}</div>
    </div>
    <div class="ametrics">${cells}</div>
    ${sparkline(a.trend, p.color)}
  </div>`;
}
function acardSkeleton(k){
  const p = PLAT_MAP[k];
  const cells = METRICS.map(mt=>`<div class="ametric"><div class="mv">—</div><div class="ml">${mt.t}</div></div>`).join('');
  return `<div class="acard skeleton">
    <div class="acard-h" style="background:${p.color}">
      <div><div class="an">${p.name}（待填入）</div></div>
      <div class="abadge">${p.abbr}</div>
    </div>
    <div class="ametrics">${cells}</div>
    <div class="aspark empty">填入数据后显示涨粉趋势</div>
  </div>`;
}
function trendPanel(){
  const withT = ACCOUNTS.filter(a=>a.trend && a.trend.length>=2);
  if(withT.length===0) return '';
  const months = [];
  withT.forEach(a=>a.trend.forEach(t=>{ if(!months.includes(t.m)) months.push(t.m); }));
  const w=680,h=230,padL=46,padR=16,padT=16,padB=30;
  const n=months.length;
  const xAt = i => padL + (n===1?0:i*(w-padL-padR)/(n-1));
  let allv=[]; withT.forEach(a=>a.trend.forEach(t=>allv.push(t.fans)));
  const mx=Math.max(...allv), mn=Math.min(...allv,0), rng=(mx-mn)||1;
  const yAt = v => padT + (1-(v-mn)/rng)*(h-padT-padB);
  let grid='';
  months.forEach((m,i)=>{ grid += `<text x="${xAt(i).toFixed(1)}" y="${h-9}" font-size="10" fill="#8C96A5" text-anchor="middle">${esc(m)}</text>`; });
  grid += `<text x="${padL-7}" y="${(yAt(mx)+3).toFixed(1)}" font-size="9" fill="#8C96A5" text-anchor="end">${fmtNum(mx)}</text>`;
  grid += `<text x="${padL-7}" y="${(yAt(0)+3).toFixed(1)}" font-size="9" fill="#8C96A5" text-anchor="end">0</text>`;
  let lines='';
  withT.forEach(a=>{
    const color = (PLAT_MAP[a.key]||{}).color || '#888';
    const pts = months.map((m,i)=>{ const t=a.trend.find(x=>x.m===m); return t?[xAt(i),yAt(t.fans)]:null; }).filter(Boolean);
    if(pts.length<2) return;
    const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    lines += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=> lines += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"/>`);
  });
  const legend = withT.map(a=>`<span class="lg"><i style="background:${(PLAT_MAP[a.key]||{}).color}"></i>${esc(a.name||(PLAT_MAP[a.key]||{}).name||'')}</span>`).join('');
  return `<div class="panel" style="margin-top:14px">
    <h3>粉丝数趋势<span class="hint">按月份 · 峰值 ${fmtNum(mx)}</span></h3>
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${grid}${lines}</svg>
    <div class="legend" style="margin-top:8px;padding-top:8px;justify-content:flex-start">${legend}</div>
  </div>`;
}
function renderData(){
  const root = document.getElementById('dataView');
  if(ACCOUNTS.length === 0){
    const prev = ['xhs','gzh','wb']; // 用户提到的三个平台
    root.innerHTML = `
      <div class="empty-tip">
        <div class="t">账号数据待填入</div>
        <div class="s">把各平台后台的粉丝数 / 浏览量等发我（或导出 CSV 报表），我来录入并生成趋势图</div>
        <div class="hint">支持指标：粉丝数 · 近30天涨粉 · 累计/近30天浏览 · 单篇平均 · 赞藏 · 评论 · 收藏<br>
          数据来源：小红书 / 公众号 / 微博 后台，或数据报表导出</div>
      </div>
      <div class="acards">${prev.map(acardSkeleton).join('')}</div>
      <div class="dtip">📌 框架说明：每个平台一张指标卡（8 项指标 + 涨粉趋势曲线），下方汇总「粉丝数趋势」多平台对比图。
        你给数字我填，<b>绝不编造</b>。后续若想用「开后台扫码 → 我截图读数」的方式自动采集，也可作为按需流程再加。</div>`;
    return;
  }
  root.innerHTML = `<div class="acards">${ACCOUNTS.map(acard).join('')}</div>${trendPanel()}`;
}

/* ==================== 全平台原始数据 ==================== */
function rawVal(v, prefix, unit){
  if(v==null || v==='') return '—';
  let s = typeof v==='number' ? (prefix||'')+fmtNum(v) : (prefix||'')+String(v);
  if(unit) s += unit;
  return s;
}
function rawMom(mom){
  if(mom==null || mom==='') return '<span class="mom na">—</span>';
  const down=/↓/.test(mom), up=/↑|\+/.test(mom);
  return `<span class="mom ${down?'down':up?'up':''}">${esc(mom)}</span>`;
}
function renderRaw(){
  const root = document.getElementById('rawView');
  if(RAW_PLATFORMS.length === 0){
    root.innerHTML = `<div class="empty-tip"><div class="t">全平台原始数据框架</div>
      <div class="s">把各平台后台导出的原始数据报表发我，我按结构填入</div></div>`;
    return;
  }
  const meta = RAW_META;
  let html = `<div class="raw-head">
      <div class="raw-title">全平台原始数据</div>
      <div class="raw-meta">数据日期：<b>${esc(meta.dataDate||'—')}</b> · 采集时间：<b>${esc(meta.collectTime||'—')}</b></div>
    </div><div class="raw-grid">`;

  html += RAW_PLATFORMS.map(plat=>{
    const p = PLAT_MAP[plat.key] || {name:plat.badge, color:'#888'};
    let card = `<div class="raw-card">
      <div class="raw-card-h" style="background:${p.color}">
        <span class="pbadge">${esc(plat.badge||p.name)}</span>
        <span class="pname">${esc(plat.name||'')}</span>
      </div><div class="raw-card-b">`;

    if(plat.metrics && plat.metrics.length){
      card += `<table class="raw-tbl"><thead><tr><th>指标</th><th style="text-align:right">数值</th><th style="text-align:center">环比</th></tr></thead><tbody>` +
        plat.metrics.map(mt=>`<tr><td>${esc(mt.label)}</td>
          <td class="num">${rawVal(mt.value, mt.prefix, mt.unit)}</td>
          <td class="mom">${rawMom(mt.mom)}</td></tr>`).join('') + `</tbody></table>`;
    }

    if(plat.topContent){
      const tc = plat.topContent;
      card += `<div class="raw-top-title">${esc(tc.title)}</div>`;
      card += `<table class="raw-tbl"><thead><tr>${tc.cols.map(c=>`<th>${esc(c.t)}</th>`).join('')}</tr></thead><tbody>`;
      if(tc.rows && tc.rows.length){
        card += tc.rows.map(r=>`<tr>${tc.cols.map(c=>{
          const v = r[c.k];
          if(c.k==='rank') return `<td class="rk">${esc(v)}</td>`;
          return `<td class="${c.k==='title'?'tt':''}">${v==null||v===''?'—':esc(v)}</td>`;
        }).join('')}</tr>`).join('');
      }else{
        card += Array.from({length:5}).map(()=>`<tr>${tc.cols.map(()=>`<td class="ph">—</td>`).join('')}</tr>`).join('');
      }
      card += `</tbody></table>`;
      if(plat.note) card += `<div class="raw-note">*注：${esc(plat.note)}</div>`;
    }

    card += `</div></div>`;
    return card;
  }).join('');

  html += `</div><div class="raw-foot">` +
    (meta.brand?`<div class="rf-brand">${esc(meta.brand)}</div>`:'') +
    `<div class="rf-line">数据来源：<b>${esc(meta.sources||'—')}</b></div>` +
    `<div class="rf-line">数据周期：<b>${esc(meta.period||'—')}</b> | 更新于：<b>${esc(meta.updatedAt||'—')}</b> | 采集方式：<b>${esc(meta.method||'—')}</b></div>` +
    `</div>`;
  root.innerHTML = html;
}

/* ==================== 总渲染 ==================== */
function renderAll(){
  // 顶部模式切换：发布规划 / 账号数据 / 全平台原始数据
  document.getElementById('planView').classList.toggle('hidden', state.mode!=='plan');
  document.getElementById('dataView').classList.toggle('hidden', state.mode!=='data');
  document.getElementById('rawView').classList.toggle('hidden', state.mode!=='raw');
  document.querySelectorAll('#subnav .seg').forEach(b=>b.classList.toggle('on', b.dataset.mode===state.mode));
  if(state.mode==='data'){ renderData(); return; }
  if(state.mode==='raw'){ renderRaw(); return; }

  renderStats(); renderCharts(); renderColBars(); renderMonthTabs(); renderChips(); renderTabs();
  const list = curItems();
  const posts = list.reduce((s,it)=>s+visPlats(it).length,0);
  const m = MONTH_MAP[state.month];
  document.getElementById('nobar').textContent =
    `${m.name}（${m.grid[0].label} — ${m.grid[m.grid.length-1].label}）· 当前显示 ${list.length} 条选题 / ${posts} 条平台发布` +
    (list.length ? ' · 点击任意卡片查看详情' : ' · 本月待补充');

  ['cal','plat','list'].forEach(v=>{
    document.getElementById('view'+v.charAt(0).toUpperCase()+v.slice(1)).classList.toggle('hidden', state.view!==v);
  });
  if(state.view==='cal') renderCal();
  if(state.view==='plat') renderPlat();
  if(state.view==='list') renderList();
  renderEmptyTip();
  renderLegend();
  const fn = document.getElementById('footNote');
  fn.textContent = hasDraft()
    ? '实线 = 已确认排期 · 虚线 +「建议」角标 = 待确认的建议排期'
    : '9 月为已确认排期 · 10—12 月留空待补充';
}

renderAll();
</script>
