let busy = false;
async function unlock(){
  if(busy) return;
  const pw = document.getElementById("pw").value;
  const errEl = document.getElementById("err"), btn = document.getElementById("btn");
  if(!pw) { errEl.textContent = "请输入口令"; return; }
  busy = true; btn.disabled = true; btn.textContent = "解密中…"; errEl.textContent = "";
  try{
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64d(SALT), iterations:ITER, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(NONCE)}, key, b64d(CT));
    const html = new TextDecoder().decode(buf);
    remember(pw);
    document.open(); document.write(html); document.close();
  }catch(e){
    try{ localStorage.removeItem(STORE); }catch(_){}
    const pwEl = document.getElementById("pw");
    if(pwEl) pwEl.style.display = "";
    btn.style.display = "";
    const sub = document.querySelector(".gate p");
    if(sub) sub.textContent = "该页面为私密内容，请输入口令查看";
    errEl.textContent = "口令不正确，请重试";
    btn.disabled = false; btn.textContent = "进入"; busy = false;
  }
}
/* 已记住口令（本机）→ 直接放行，不再显示密码框
   也支持带 ?k=<base64口令> 的一次性绑定链接：打开即记住，随后自动清掉 URL 参数 */
(function(){
  const pwEl = document.getElementById("pw"), btn = document.getElementById("btn");
  let cached = savedPw();
  if(!cached){
    const kp = new URLSearchParams(location.search).get("k");
    if(kp){
      try{ cached = atob(kp); }catch(e){ cached = ""; }
      if(cached){
        try{ history.replaceState(null, "", location.origin + location.pathname); }catch(e){}
      }
    }
  }
  if(cached){
    pwEl.value = cached;
    pwEl.style.display = "none";
    btn.style.display = "none";
    const sub = document.querySelector(".gate p");
    if(sub) sub.textContent = "正在打开…";
    unlock();
  }
})();
</script>
